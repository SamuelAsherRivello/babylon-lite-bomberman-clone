schema: spec-driven
context: |
  Repository: SamuelAsherRivello/babylon-lite-bomberman-clone.
  Purpose: original SNES-inspired 2D competitive Bomberman Clone for 1–4
  online humans plus CPUs filling four battle seats, linked from README.
  Verified baseline: React/Vite ESM, npm root, application under bomberman-clone/;
  Babylon Lite 1.32.0/WebGPU renderer and released Colyseus shared client
  v0.9.7 are installed for released game v0.0.5. Preserve template corner UI roles and application root.
  PC landscape and mobile portrait viewport compositions, four gutters, nearest-sampled 16px original tiles,
  precise simulation/prediction coordinates and CSS-resolution React UI.
  Runtime targets: desktop and mobile WebGPU browsers with keyboard and touch.
  Deployment: existing GitHub Pages workflow for the client; shared server at
  SamuelAsherRivello/rmc-colyseus-multiplayer-server. Backend release v0.9.2
  passed deployment and existing-game live checks. Vercel has a
  300-second connection lifetime, explicitly accepted by the user. Preserve it and disclose expiry.
  All three milestones are verified, synced and archived.
  Public Pages client and compatible canonical backend v0.9.3 passed two-browser
  round/reconnect checks. Gameplay Polish remains: power-ups, sudden death,
  first-to-three matches/rematches, animated original art, original music/effects,
  mute checkbox, volume and URL mute are implemented. Public v0.0.4 full match/rematch,
  pickup/chain, latency/jitter, recovery and mobile checks passed. A real-time local
  two-browser sudden-death draw passed. Current server typecheck and 70 local regressions pass.
  Game Feedback 1 adds twelve requested arena/CPU/UI/pickup options; 40 client
  checks and build pass. Public v0.0.5 full-match/rematch, latency/jitter,
  recovery, touch and CPU-count/options checks pass. Shared v0.9.7 deployment
  passed Bomberman live checks but failed two unrelated games (68/70 public);
  rollback failed HTTP 402. Preserve this disclosure rather than claiming all green.
  In-memory hosting can lose admission/recovery before five minutes; disclose this
  observed limitation and new-room guidance rather than promising durable rooms.
  Updated template 6a6b7d1 was reconciled after checkpoint 88b39a5. Preserve
  latest-stable CLI 1.14.0 and the user's explicit music requirement as overrides.
  Dependencies: add only required packages, verify compatible pinned renderer
  and networking APIs against actual source; never substitute full Babylon.js.
  Security: authoritative server validates gameplay inputs, no browser secrets,
  bounded room/reconnection state, preserve unrelated work and existing games.
  Verified commands: npm ci, npm test, npm run build, npm run dev, npm run preview,
  npm run test:browser (requires running game/backend and Chrome WebGPU).
  OpenSpec CLI 1.14.0 and doctor verified healthy. Implement three sequential
  changes: Foundation, Multiplayer Setup, Gameplay Polish; finish, verify,
  sync and archive each before proposing the next. Planning requests alone
  do not authorize implementation. No pull requests unless explicitly requested.
  Canonical project documentation assets live in bomberman-clone/documentation/.
  Before proposing or applying a change, record the project's verified purpose,
  runtime targets, architecture, dependency policy, security constraints, and
  validation commands here.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.

